<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6B62">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:auto}body{margin:0}[hidden]{display:none!important}</style>
<title>Mes tâches</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Mise en page : une colonne étroite, grand en-tête daté, un seul panneau d'ajout en relief, lignes séparées par des filets. */
:root {
  --bg: #EDF1EF;
  --surface: #F8FAF9;
  --ink: #17282A;
  --muted: #566868;
  --line: #D3DCDA;
  --accent: #0E6B62;
  --accent-ink: #FFFFFF;
  --alert: #B8400F;
  --alert-ink: #FFFFFF;
  --done: #7F9491;
  --font-display: 'Familjen Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1716;
    --surface: #16211F;
    --ink: #E4EEEC;
    --muted: #93A8A5;
    --line: #2A3A38;
    --accent: #4FD1BE;
    --accent-ink: #06201C;
    --alert: #FF9060;
    --alert-ink: #1E0E06;
    --done: #6B8380;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1716;
  --surface: #16211F;
  --ink: #E4EEEC;
  --muted: #93A8A5;
  --line: #2A3A38;
  --accent: #4FD1BE;
  --accent-ink: #06201C;
  --alert: #FF9060;
  --alert-ink: #1E0E06;
  --done: #6B8380;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.45 var(--font-body);
  padding-inline: 16px;
  padding-block: 0;
}
.wrap { max-width: 560px; margin: 0 auto; padding-block: 22px 40px; display: grid; gap: 20px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

header { display: grid; gap: 2px; }
.eyebrow { margin: 0; font-size: .8rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { margin: 0; font: 700 clamp(2rem, 9vw, 2.8rem)/1.05 var(--font-display); letter-spacing: -.02em; text-wrap: balance; }
.summary { margin: 4px 0 0; color: var(--muted); font-variant-numeric: tabular-nums; }

.add { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 12px; }
.add-main { display: flex; gap: 8px; }
.add-main input { flex: 1; min-width: 0; }
.add-opts { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.opt { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); font-weight: 500; }
.opt input { min-width: 0; }
input[type="text"], input[type="date"], input[type="time"] {
  font: inherit; font-size: 1rem; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; height: 46px;
}
input::placeholder { color: var(--muted); opacity: .85; }
button, .act { font: inherit; cursor: pointer; }
.btn-add { height: 46px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 600; white-space: nowrap; }
.chip { height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--alert); border-color: var(--alert); color: var(--alert-ink); }

.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.tab .n { font-variant-numeric: tabular-nums; font-weight: 500; opacity: .85; }
.tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

.list { list-style: none; margin: 0; padding: 0; min-height: 120px; }
.task { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 4px 4px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.task:first-child { border-top: 1px solid var(--line); }
.check { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; padding: 0; }
.box { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.box svg { width: 14px; height: 14px; }
.check[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.body { min-width: 0; display: grid; gap: 2px; padding-block: 6px; }
.t-title { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.task.is-done .t-title { text-decoration: line-through; color: var(--done); }
.meta { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta .late { color: var(--alert); font-weight: 600; }
.meta .imp { color: var(--alert); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.task.is-done .meta { color: var(--done); }
.act { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); border-radius: 10px; text-decoration: none; padding: 0; }
.act svg { width: 22px; height: 22px; }
.act.cal { color: var(--accent); }
.act:hover { background: var(--surface); }

.empty { margin: 0; padding: 36px 8px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font: 600 1.15rem/1.3 var(--font-display); margin-bottom: 4px; }

.foot { margin: 0; font-size: .82rem; color: var(--muted); display: grid; gap: 6px; }

.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 528px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast button { background: none; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; padding: 6px 4px; min-height: 36px; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .box { transition: none; } }
@media (max-width: 420px) {
  .btn-add .txt { display: none; }
  .btn-add { padding: 0 18px; font-size: 1.3rem; line-height: 1; }
}
</style>
</head>
<body>

<main class="wrap">
  <header>
    <p class="eyebrow" id="dateLine"></p>
    <h1>Mes tâches</h1>
    <p class="summary" id="summary"></p>
  </header>

  <form id="addForm" class="add" autocomplete="off">
    <div class="add-main">
      <label class="sr" for="title">Nouvelle tâche</label>
      <input id="title" type="text" placeholder="Ajouter une tâche" maxlength="200" required>
      <button type="submit" class="btn-add" aria-label="Ajouter la tâche">+<span class="txt"> Ajouter</span></button>
    </div>
    <div class="add-opts">
      <label class="opt" for="due"><span>Date</span><input id="due" type="date"></label>
      <label class="opt" for="time"><span>Heure</span><input id="time" type="time"></label>
      <button type="button" id="imp" class="chip" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg>
        Important
      </button>
    </div>
  </form>

  <nav class="tabs" id="tabs" aria-label="Filtrer les tâches"></nav>

  <ul class="list" id="list"></ul>

  <p class="foot">
    <span>L’icône calendrier ouvre Google Agenda avec la tâche déjà remplie. Il reste à appuyer sur Enregistrer dans Agenda.</span>
    <span id="note"></span>
  </p>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastText"></span>
  <button type="button" id="toastBtn" hidden>Annuler</button>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var todayStr = function () { return ymd(new Date()); };
  var addDays = function (d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; };
  var parseYmd = function (s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}

  var LS = 'mes-taches-v1', LSF = 'mes-taches-filtre';
  var tasks = [];
  var filter = 'todo';
  var mode = 'local';
  var col = null;
  var ready = false;
  var pending = {};
  var lastDeleted = null;
  var toastTimer = 0;

  try { var f = localStorage.getItem(LSF); if (f) filter = f; } catch (e) {}

  var ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13v4.5M9.75 15.25h4.5"/></svg>',
    del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l.8 12.5h9.4L17.5 7M10 11v5M14 11v5"/></svg>',
    flag: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg>'
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- Google Agenda ---------- */
  function fmtLocal(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00'; }
  function fmtDay(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function calUrl(t) {
    var u = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(t.title);
    if (t.due) {
      var d = parseYmd(t.due);
      if (t.time) {
        var hm = t.time.split(':').map(Number);
        var s = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hm[0], hm[1]);
        var e = new Date(s.getTime() + 3600000);
        u += '&dates=' + fmtLocal(s) + '/' + fmtLocal(e);
        if (tz) u += '&ctz=' + encodeURIComponent(tz);
      } else {
        u += '&dates=' + fmtDay(d) + '/' + fmtDay(addDays(d, 1));
      }
    }
    u += '&details=' + encodeURIComponent('Tâche ajoutée depuis Mes tâches');
    return u;
  }

  /* ---------- Stockage ---------- */
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(tasks)); } catch (e) {} }
  function loadLocal() {
    try { var raw = localStorage.getItem(LS); tasks = raw ? JSON.parse(raw) : []; } catch (e) { tasks = []; }
    if (!Array.isArray(tasks)) tasks = [];
    ready = true;
  }
  function fail(e) {
    var code = e && e.code;
    showToast(code === 'quota_exceeded' ? 'Stockage plein : supprimez des tâches terminées.' : 'Enregistrement impossible. Réessayez dans un instant.');
  }
  async function addTask(t) {
    if (mode === 'db') { try { await col.doc(t.id).set(t); } catch (e) { fail(e); } }
    else { tasks.push(t); saveLocal(); render(); }
  }
  async function patchTask(id, patch) {
    if (pending[id]) return;
    pending[id] = true;
    try {
      if (mode === 'db') { await col.doc(id).update(patch); }
      else { var t = tasks.find(function (x) { return x.id === id; }); if (t) { Object.assign(t, patch); saveLocal(); render(); } }
    } catch (e) { fail(e); }
    delete pending[id];
  }
  async function removeTask(id) {
    if (pending[id]) return;
    pending[id] = true;
    try {
      if (mode === 'db') { await col.doc(id).delete(); }
      else { tasks = tasks.filter(function (x) { return x.id !== id; }); saveLocal(); render(); }
    } catch (e) { fail(e); }
    delete pending[id];
  }

  /* ---------- Données dérivées ---------- */
  function counts() {
    var t = todayStr();
    var open = tasks.filter(function (x) { return !x.done; });
    return {
      todo: open.length,
      today: open.filter(function (x) { return x.due && x.due <= t; }).length,
      soon: open.filter(function (x) { return x.due && x.due > t; }).length,
      done: tasks.length - open.length
    };
  }
  function cmpOpen(a, b) {
    var ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
    if (ad !== bd) return ad < bd ? -1 : 1;
    var at = a.time || '99:99', bt = b.time || '99:99';
    if (at !== bt) return at < bt ? -1 : 1;
    if (!!a.important !== !!b.important) return a.important ? -1 : 1;
    return (a.createdAt || 0) - (b.createdAt || 0);
  }
  function visible() {
    var t = todayStr(), a;
    if (filter === 'today') a = tasks.filter(function (x) { return !x.done && x.due && x.due <= t; });
    else if (filter === 'soon') a = tasks.filter(function (x) { return !x.done && x.due && x.due > t; });
    else if (filter === 'done') a = tasks.filter(function (x) { return x.done; });
    else a = tasks.filter(function (x) { return !x.done; });
    if (filter === 'done') a.sort(function (x, y) { return (y.doneAt || 0) - (x.doneAt || 0); });
    else a.sort(cmpOpen);
    return a;
  }
  function dueInfo(t) {
    if (!t.due) return null;
    var today = todayStr();
    var tmr = ymd(addDays(new Date(), 1)), yst = ymd(addDays(new Date(), -1));
    var txt;
    if (t.due === today) txt = 'Aujourd’hui';
    else if (t.due === tmr) txt = 'Demain';
    else if (t.due === yst) txt = 'Hier';
    else txt = parseYmd(t.due).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    if (t.time) txt += ' · ' + t.time.replace(':', 'h');
    var now = new Date();
    var nowHM = pad(now.getHours()) + ':' + pad(now.getMinutes());
    var late = !t.done && (t.due < today || (t.due === today && t.time && t.time < nowHM));
    return { txt: late ? 'En retard · ' + txt : txt, late: late };
  }

  /* ---------- Rendu ---------- */
  var TABS = [['todo', 'À faire'], ['today', 'Aujourd’hui'], ['soon', 'À venir'], ['done', 'Terminées']];
  function render() {
    var c = counts();
    $('dateLine').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    var s;
    if (!tasks.length) s = ready ? 'Aucune tâche pour l’instant' : '';
    else if (!c.todo) s = 'Tout est fait, bravo';
    else s = c.todo + (c.todo > 1 ? ' tâches à faire' : ' tâche à faire') + (c.today ? ' · ' + c.today + ' pour aujourd’hui ou en retard' : '');
    $('summary').textContent = s;

    var tabs = $('tabs');
    tabs.textContent = '';
    TABS.forEach(function (tb) {
      var b = el('button', 'tab');
      b.type = 'button';
      b.dataset.f = tb[0];
      b.setAttribute('aria-pressed', filter === tb[0] ? 'true' : 'false');
      b.appendChild(el('span', null, tb[1]));
      b.appendChild(el('span', 'n', String(c[tb[0]])));
      tabs.appendChild(b);
    });

    var list = $('list');
    list.textContent = '';
    var items = visible();
    if (!items.length) {
      if (!ready) return;
      var p = el('li', 'empty');
      var msgs = {
        todo: ['Rien à faire', 'Ajoutez votre première tâche avec le champ ci-dessus.'],
        today: ['Rien pour aujourd’hui', 'Les tâches datées d’aujourd’hui ou en retard apparaissent ici.'],
        soon: ['Rien de prévu', 'Donnez une date à une tâche pour la retrouver ici.'],
        done: ['Aucune tâche terminée', 'Cochez une tâche pour la voir ici.']
      }[filter];
      var st = el('strong', null, msgs[0]);
      p.appendChild(st);
      p.appendChild(document.createTextNode(msgs[1]));
      list.appendChild(p);
      return;
    }
    items.forEach(function (t) {
      var li = el('li', 'task' + (t.done ? ' is-done' : ''));
      li.dataset.id = t.id;

      var chk = el('button', 'check');
      chk.type = 'button';
      chk.setAttribute('aria-pressed', t.done ? 'true' : 'false');
      chk.setAttribute('aria-label', t.done ? 'Remettre à faire : ' + t.title : 'Marquer comme terminée : ' + t.title);
      var box = el('span', 'box');
      box.innerHTML = ICON.check;
      chk.appendChild(box);

      var body = el('div', 'body');
      body.appendChild(el('p', 't-title', t.title));
      var di = dueInfo(t);
      if (di || t.important) {
        var meta = el('p', 'meta');
        if (di) meta.appendChild(el('span', di.late ? 'late' : '', di.txt));
        if (t.important) { var im = el('span', 'imp'); im.innerHTML = ICON.flag; im.appendChild(document.createTextNode('Important')); meta.appendChild(im); }
        body.appendChild(meta);
      }

      var cal = el('a', 'act cal');
      cal.href = calUrl(t);
      cal.target = '_blank';
      cal.rel = 'noopener noreferrer';
      cal.title = 'Ajouter à Google Agenda';
      cal.setAttribute('aria-label', 'Ajouter à Google Agenda : ' + t.title);
      cal.innerHTML = ICON.cal;

      var del = el('button', 'act del');
      del.type = 'button';
      del.title = 'Supprimer';
      del.setAttribute('aria-label', 'Supprimer : ' + t.title);
      del.innerHTML = ICON.del;

      li.appendChild(chk); li.appendChild(body); li.appendChild(cal); li.appendChild(del);
      list.appendChild(li);
    });
  }

  function setNote() {
    $('note').textContent = mode === 'db'
      ? 'Vos tâches sont enregistrées avec votre compte Claude et retrouvées sur vos autres appareils.'
      : 'Vos tâches sont enregistrées sur cet appareil uniquement.';
  }

  function showToast(msg, undo) {
    clearTimeout(toastTimer);
    $('toastText').textContent = msg;
    $('toastBtn').hidden = !undo;
    $('toast').hidden = false;
    toastTimer = setTimeout(function () { $('toast').hidden = true; lastDeleted = null; }, 6000);
  }

  /* ---------- Événements ---------- */
  $('imp').addEventListener('click', function () {
    this.setAttribute('aria-pressed', this.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
  });

  $('addForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var title = $('title').value.trim();
    if (!title) return;
    var due = $('due').value, time = $('time').value;
    if (time && !due) due = todayStr();
    var t = {
      id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      title: title,
      due: due || '',
      time: time || '',
      important: $('imp').getAttribute('aria-pressed') === 'true',
      done: false,
      doneAt: 0,
      createdAt: Date.now()
    };
    $('title').value = ''; $('due').value = ''; $('time').value = '';
    $('imp').setAttribute('aria-pressed', 'false');
    if (filter === 'done') { filter = 'todo'; try { localStorage.setItem(LSF, filter); } catch (e) {} }
    addTask(t);
    $('title').focus();
  });

  $('tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('.tab');
    if (!b) return;
    filter = b.dataset.f;
    try { localStorage.setItem(LSF, filter); } catch (e) {}
    render();
  });

  $('list').addEventListener('click', function (ev) {
    var li = ev.target.closest('.task');
    if (!li) return;
    var id = li.dataset.id;
    var t = tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    if (ev.target.closest('.check')) {
      patchTask(id, { done: !t.done, doneAt: t.done ? 0 : Date.now() });
    } else if (ev.target.closest('.del')) {
      lastDeleted = Object.assign({}, t);
      removeTask(id);
      showToast('Tâche supprimée', true);
    }
  });

  $('toastBtn').addEventListener('click', function () {
    if (lastDeleted) { var t = lastDeleted; lastDeleted = null; addTask(t); }
    $('toast').hidden = true;
    clearTimeout(toastTimer);
  });

  /* ---------- Démarrage ---------- */
  async function init() {
    render();
    var fallbackTimer = setTimeout(function () { if (!ready) { ready = true; render(); } }, 2500);
    try {
      var c = window.claude;
      if (c && c.use) {
        var res = await Promise.all([c.use('db'), c.use('user')]);
        var db = res[0], user = res[1];
        if (db && user) {
          var uid = await user.id();
          if (uid) {
            col = db.collection('data/users/' + uid);
            mode = 'db';
            setNote();
            col.onSnapshot(function (snap) {
              tasks = snap.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); });
              ready = true;
              clearTimeout(fallbackTimer);
              render();
            }, function () {
              mode = 'local'; col = null; loadLocal(); setNote(); render();
            });
            return;
          }
        }
      }
    } catch (e) {}
    clearTimeout(fallbackTimer);
    mode = 'local';
    loadLocal();
    setNote();
    render();
  }
  init();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
